<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Управление сервером</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .panel {
      width: 460px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    .server-box,
    .service-box {
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .main-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .relay-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .relay-row {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 14px;
    }

    .relay-name {
      font-size: 16px;
      margin-bottom: 10px;
      color: #e2e8f0;
    }

    .relay-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .power-btn {
      background: #3b82f6;
    }

    .power-btn:hover {
      background: #2563eb;
    }

    .reset-btn {
      background: #f59e0b;
    }

    .reset-btn:hover {
      background: #d97706;
    }

    .on-btn {
      background: #22c55e;
    }

    .on-btn:hover {
      background: #16a34a;
    }

    .off-btn {
      background: #ef4444;
    }

    .off-btn:hover {
      background: #dc2626;
    }

    .sw-btn {
      background: #8b5cf6;
    }

    .sw-btn:hover {
      background: #7c3aed;
    }

    .status {
      margin-top: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      font-size: 14px;
      color: #cbd5e1;
      min-height: 44px;
    }

    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="title">Управление сервером</div>

    <div class="server-box">
      <div class="section-title">Основные действия</div>
      <div class="main-buttons">
        <button class="power-btn" id="powerBtn" onclick="serverPower()">Power</button>
        <button class="reset-btn" id="resetBtn" onclick="serverReset()">Reset</button>
      </div>
      <div class="hint">
        Power → POST /relay_1_sw, Reset → POST /relay_2_sw
      </div>
      <div class="status" id="mainStatus">Статус: готово</div>
    </div>

    <div class="service-box">
      <div class="section-title">Ручное управление реле</div>

      <div class="relay-grid">
        <div class="relay-row" id="relay-block-1">
          <div class="relay-name">Relay 1 (Power)</div>
          <div class="relay-buttons">
            <button class="on-btn" onclick="controlRelay(1, 'on')">ON</button>
            <button class="off-btn" onclick="controlRelay(1, 'off')">OFF</button>
            <button class="sw-btn" onclick="switchRelay(1)">SW</button>
          </div>
          <div class="status" id="status1">Статус: неизвестно</div>
        </div>

        <div class="relay-row" id="relay-block-2">
          <div class="relay-name">Relay 2 (Reset)</div>
          <div class="relay-buttons">
            <button class="on-btn" onclick="controlRelay(2, 'on')">ON</button>
            <button class="off-btn" onclick="controlRelay(2, 'off')">OFF</button>
            <button class="sw-btn" onclick="switchRelay(2)">SW</button>
          </div>
          <div class="status" id="status2">Статус: неизвестно</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function setStatus(relay, text) {
      document.getElementById('status' + relay).textContent = 'Статус: ' + text;
    }

    function setMainStatus(text) {
      document.getElementById('mainStatus').textContent = 'Статус: ' + text;
    }

    function setRelayButtonsDisabled(relay, disabled) {
      const block = document.getElementById('relay-block-' + relay);
      const buttons = block.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = disabled);
    }

    function setMainButtonsDisabled(disabled) {
      document.getElementById('powerBtn').disabled = disabled;
      document.getElementById('resetBtn').disabled = disabled;
    }

    async function postCommand(url) {
      const response = await fetch(url, {
        method: 'POST'
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const contentType = response.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        const data = await response.json();
        return JSON.stringify(data);
      }

      return await response.text();
    }

    async function controlRelay(relay, action) {
      const url = `/relay_${relay}_${action}`;
      setStatus(relay, `выполняется ${url} ...`);

      try {
        const result = await postCommand(url);
        setStatus(relay, result || `команда ${action} выполнена`);
      } catch (error) {
        setStatus(relay, 'Ошибка: ' + error.message);
      }
    }

    async function switchRelay(relay) {
      const url = `/relay_${relay}_sw`;
      setStatus(relay, `выполняется ${url} ...`);

      try {
        const result = await postCommand(url);
        setStatus(relay, result || 'импульс выполнен');
      } catch (error) {
        setStatus(relay, 'Ошибка: ' + error.message);
      }
    }

    async function serverPower() {
      setMainButtonsDisabled(true);
      setRelayButtonsDisabled(1, true);
      setMainStatus('Power: выполняется POST /relay_1_sw ...');
      setStatus(1, 'Power: выполняется импульс');

      try {
        const result = await postCommand('/relay_1_sw');
        setMainStatus(result || 'Power выполнено');
        setStatus(1, result || 'Power выполнено');
      } catch (error) {
        setMainStatus('Power: ошибка - ' + error.message);
        setStatus(1, 'Power: ошибка - ' + error.message);
      } finally {
        setMainButtonsDisabled(false);
        setRelayButtonsDisabled(1, false);
      }
    }

    async function serverReset() {
      setMainButtonsDisabled(true);
      setRelayButtonsDisabled(2, true);
      setMainStatus('Reset: выполняется POST /relay_2_sw ...');
      setStatus(2, 'Reset: выполняется импульс');

      try {
        const result = await postCommand('/relay_2_sw');
        setMainStatus(result || 'Reset выполнено');
        setStatus(2, result || 'Reset выполнено');
      } catch (error) {
        setMainStatus('Reset: ошибка - ' + error.message);
        setStatus(2, 'Reset: ошибка - ' + error.message);
      } finally {
        setMainButtonsDisabled(false);
        setRelayButtonsDisabled(2, false);
      }
    }
  </script>
</body>
</html>
